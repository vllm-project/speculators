steps:
  - group: ":test_tube: Nightly Unit Tests (A100)"
    steps:
      - label: ":python: Unit Tests py{{matrix.python}} / transformers {{matrix.transformers}}"
        agents:
          queue: RedHat-A100-WDC

        retry:
          automatic:
            - exit_status: -1
              limit: 3
            - exit_status: 255
              limit: 3
            - signal_reason: agent_stop
              limit: 3

        plugins:
          - kubernetes:
              podSpec:
                serviceAccountName: buildkite-anyuid
                securityContext:
                  fsGroup: 0
                  runAsUser: 0
                  runAsGroup: 0
                nodeSelector:
                  vllm.ci/gpu-pool: upstream-ci-a100

                containers:
                  - name: tests
                    image: buildkite/agent:3-ubuntu
                    command:
                      - chmod +x .buildkite/scripts/run-tests.sh
                      - .buildkite/scripts/run-tests.sh unit

                    resources:
                      limits:
                        nvidia.com/gpu: 1

                    volumeMounts:
                      - name: ci-cache
                        mountPath: /model-cache
                        readOnly: false
                      - name: devshm
                        mountPath: /dev/shm

                    env:
                      - name: PYTHON_VERSION
                        value: "{{matrix.python}}"
                      - name: TRANSFORMERS_VERSION
                        value: "{{matrix.transformers}}"
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: hf-token-secret
                            key: token

                volumes:
                  - name: ci-cache
                    hostPath:
                      path: /var/mnt/ci-cache
                      type: DirectoryOrCreate
                  - name: devshm
                    emptyDir:
                      medium: Memory

        matrix:
          setup:
            python: ["3.13"]
            transformers: ["latest"]

