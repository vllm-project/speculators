steps:
  - label: ":gear: Speculators Tests"
    command: |
      RUNNER=$$(buildkite-agent meta-data get "test-runner" --default "H100")
      echo "╔══════════════════════════════════════════╗"
      echo "║          BUILD SUMMARY                   ║"
      echo "╠══════════════════════════════════════════╣"
      echo "║ Triggered by : $${BUILDKITE_BUILD_CREATOR}"
      echo "║ Source        : $${BUILDKITE_SOURCE}"
      echo "║ Branch        : $${BUILDKITE_BRANCH}"
      echo "║ Commit        : $${BUILDKITE_COMMIT:0:8}"
      echo "║ PR            : $${BUILDKITE_PULL_REQUEST:-none}"
      echo "║ GPU Runner    : $${RUNNER}"
      echo "╚══════════════════════════════════════════╝"

      if [[ "$${BUILDKITE_SOURCE}" == "schedule" ]]; then
        echo "--- Uploading nightly tests pipeline"
        buildkite-agent pipeline upload .buildkite/nightly/nightly-$${RUNNER}.yml
      else
        echo "--- Uploading development tests pipeline"
        buildkite-agent pipeline upload .buildkite/development/gpu-tests-$${RUNNER}.yml
      fi
