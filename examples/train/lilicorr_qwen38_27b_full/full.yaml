train:
  speculator_type: lilicorr
  seed: 42

  verifier:
    verifier_name_or_path: /tmp/models/Qwen3.8-27B

  draft:
    num_layers: 5
    target_layer_ids: [4, 12, 20, 28, 36, 44, 52, 60]
    mask_token_id: 248077
    # flex falls back to DENSE math attention in the dynamo resume frame
    # (anchor selection is @torch.compiler.disable) -> 30GiB score matrices
    # at 1024x16 anchors. SDPA + bool mask is memory-tiled instead.
    draft_attn_impl: sdpa

  data:
    data_path: /tmp/lilicorr_check/qwen38-perfectblend/datafull
    total_seq_len: 8192
    train_data_ratio: 0.99
    max_anchors: 1024
    num_workers: 4

  generation:
    vllm_endpoint: http://localhost:8000/v1
    on_missing: generate
    request_timeout: 300.0
    max_retries: 3

  loss:
    loss_fn: '{"ce":0.1,"tv":0.9}'

  optimizer:
    optimizer: muon
    lr: 1.0e-3
    weight_decay: 0.0

  scheduler:
    scheduler_type: cosine
    scheduler_warmup_ratio: 0.04

  trainer:
    epochs: 2
    checkpoint_freq: 0.05
    save_path: /tmp/lilicorr_check/qwen38-perfectblend/runfull/checkpoints
    fsdp_shard: true
    gradient_checkpointing: true

  logging:
    logger: trackio
    log_dir: /tmp/lilicorr_check/qwen38-perfectblend/runfull/logs/trackio
    run_name: qwen38-lilicorr-perfectblend-full

  dflash:
    block_size: 16
    sample_from_anchor: false
    per_position_loss_weight: fixed-exp-decay
    dflash_decay_gamma: 7.0
    # Chunked checkpointed heads: bounds the (anchors*block, vocab) head
    # tensors to one 128-anchor chunk at a time (exact loss/grad parity,
    # verified; peak 46 GiB/GPU vs 81.5 GiB monolithic which NCCL-killed).
    loss_chunk_anchors: 128

  backend:
    hidden_states_path:
