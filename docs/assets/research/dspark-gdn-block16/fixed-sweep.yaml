schemaVersion: '2.0'
randomSeed: 42
benchmark:
  model: qwen
  endpoint:
    url: http://127.0.0.1:8796
    type: chat
    streaming: true
    use_server_token_count: true
    timeout: 600
    extra:
      temperature: 0
      ignore_eos: false
      min_tokens: 0
      max_completion_tokens: 1024
      chat_template_kwargs:
        enable_thinking: false
  tokenizer:
    name: ${TARGET_MODEL_DIR}
  datasets:
  - name: main
    type: file
    path: throughput_1k.jsonl
    format: speed_bench_throughput_1k
    sampling: shuffle
    random_seed: 42
  phases:
  - name: profiling
    type: concurrency
    duration: 30
    grace_period: 120
    concurrency: 1
  server_metrics:
    enabled: true
    urls:
    - http://127.0.0.1:8796/metrics
    formats:
    - json
  artifacts:
    dir: artifacts/fixed
    summary:
    - json
    records:
    - jsonl
    raw: true
    export_outputs_json: true
  runtime:
    ui: none
sweep:
  type: zip
  same_seed: true
  iteration_order: repeated
  parameters:
    concurrency:
    - 1
    - 16
    - 64
    - 128
    duration:
    - 30
    - 30
    - 45
    - 60
multi_run:
  num_runs: 3
