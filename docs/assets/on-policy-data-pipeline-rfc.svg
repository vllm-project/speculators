<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">On-policy data pipeline RFC</title>
  <desc id="desc">Three supported inputs converge on one PreparedSample contract, while redundant tokenizer, parser, preset, logging, and preview paths are deleted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .label { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .copy { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .small { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .deleted { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #991b1b; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">On-policy data pipeline — RFC end state</text>
  <text x="60" y="84" class="subtitle">Generation and rendering differ; their output contract, parsing, validation, and storage do not.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="245" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="78" y="164" class="label">Raw prompt presets</text>
    <text x="78" y="190" class="copy">ShareGPT · UltraChat · GSM8K</text>
    <text x="78" y="211" class="copy">Source assistant turns are discarded</text>

    <rect x="55" y="285" width="245" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="78" y="319" class="label">User-provided conversations</text>
    <text x="78" y="345" class="copy">Complete target-model assistant turns</text>
    <text x="78" y="366" class="copy">Text, tools, and multimodal content</text>

    <rect x="55" y="440" width="245" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="78" y="474" class="label">Already prepared rows</text>
    <text x="78" y="500" class="copy">input_ids + loss_mask</text>
    <text x="78" y="521" class="copy">No render and no tokenizer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="125" width="250" height="115" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="415" y="160" class="label">Target response regeneration</text>
    <text x="415" y="186" class="copy">Generate assistant + tool-call tokens</text>
    <text x="415" y="207" class="copy">Replay cached tool observations only</text>

    <rect x="390" y="280" width="250" height="115" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415" y="315" class="label">Canonical conversation parser</text>
    <text x="415" y="341" class="copy">roles · content · reasoning · tools</text>
    <text x="415" y="362" class="copy">One normalization for both workflows</text>

    <rect x="710" y="280" width="185" height="115" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="735" y="315" class="label">vLLM /render</text>
    <text x="735" y="341" class="copy">Serving tokenizer</text>
    <text x="735" y="362" class="copy">Assistant boundary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="135" width="240" height="100" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="765" y="174" class="label">PreparedSample</text>
    <text x="765" y="201" class="copy">input_ids · loss_mask · messages?</text>

    <rect x="735" y="445" width="240" height="100" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="765" y="482" class="label">One finalizer</text>
    <text x="765" y="508" class="copy">validate · truncate · filter · tensorize</text>

    <rect x="1010" y="445" width="145" height="100" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1034" y="482" class="label">Training data</text>
    <text x="1034" y="508" class="copy">HF dataset</text>
  </g>

  <path d="M300 182 H390" class="line"/>
  <path d="M640 182 H735" class="line"/>
  <path d="M300 337 H390" class="line"/>
  <path d="M640 337 H710" class="line"/>
  <path d="M802 280 V255 H855 V235" class="line"/>
  <path d="M950 235 V420 H855 V445" class="line"/>
  <path d="M300 492 H735" class="line"/>
  <path d="M975 495 H1010" class="line"/>

  <rect x="55" y="590" width="1100" height="80" rx="16" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="78" y="615" class="deleted">Deleted, not moved:</text>
  <text x="78" y="639" class="copy" fill="#991b1b">local preparation processor/tokenizer · duplicate message/tool parsers · source presets in prepare_data</text>
  <text x="78" y="659" class="copy" fill="#991b1b">regeneration detokenizer/text twin · per-batch mode switch · custom logger/thread helper</text>

  <text x="1050" y="84" class="small">RFC proof of concept</text>
</svg>
